<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed - The Premium Barbershop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-charcoal text-white pt-20 flex flex-col h-screen">

    <nav class="fixed top-0 w-full z-50 bg-[#0B0B0B]/90 backdrop-blur-sm border-b border-charcoal no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <a href="index.html" class="playfair text-2xl font-bold tracking-widest text-white uppercase" id="nav-brand">THE BARBER</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-[#111111] border border-charcoal rounded-xl p-8 md:p-12 max-w-2xl w-full text-center relative overflow-hidden">
            
            <div class="absolute top-0 left-0 w-full h-2 bg-gold"></div>
            
            <div class="w-20 h-20 bg-green-500/10 border border-green-500/20 text-green-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="check" class="w-10 h-10"></i>
            </div>

            <h1 class="playfair text-4xl font-bold mb-2">Booking Confirmed</h1>
            <p class="text-gray-400 mb-8">Your appointment has been successfully booked.</p>

            <div class="bg-[#151515] rounded-lg p-6 text-left mb-8 border border-charcoal" id="print-area">
                <div class="text-center mb-6 border-b border-charcoal pb-6">
                    <span class="block text-sm text-gray-500 uppercase tracking-wider mb-1">Booking Reference</span>
                    <span class="text-3xl font-mono text-gold font-bold tracking-widest" id="conf-ref">...</span>
                </div>

                <div class="grid grid-cols-2 gap-y-6 gap-x-4">
                    <div>
                        <span class="block text-xs text-gray-500 uppercase tracking-wider mb-1">Service</span>
                        <span class="font-bold text-lg" id="conf-service">...</span>
                    </div>
                    <div>
                        <span class="block text-xs text-gray-500 uppercase tracking-wider mb-1">Barber</span>
                        <span class="font-bold text-lg" id="conf-barber">...</span>
                    </div>
                    <div>
                        <span class="block text-xs text-gray-500 uppercase tracking-wider mb-1">Date</span>
                        <span class="font-bold text-lg" id="conf-date">...</span>
                    </div>
                    <div>
                        <span class="block text-xs text-gray-500 uppercase tracking-wider mb-1">Time</span>
                        <span class="font-bold text-lg text-gold" id="conf-time">...</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 no-print">
                <button id="btn-calendar" class="btn-primary flex items-center justify-center"><i data-lucide="calendar-plus" class="w-4 h-4 mr-2"></i> ADD TO CALENDAR</button>
                <button onclick="window.print()" class="btn-outline flex items-center justify-center"><i data-lucide="printer" class="w-4 h-4 mr-2"></i> PRINT</button>
                <a href="manage-booking.html" class="btn-outline flex items-center justify-center"><i data-lucide="settings" class="w-4 h-4 mr-2"></i> MANAGE BOOKING</a>
                <a href="index.html" class="btn-outline flex items-center justify-center"><i data-lucide="home" class="w-4 h-4 mr-2"></i> BACK HOME</a>
            </div>

        </div>
    </main>

    <script src="js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            
            const dataStr = sessionStorage.getItem('booking_result');
            if (!dataStr) {
                window.location.href = 'index.html';
                return;
            }

            const data = JSON.parse(dataStr);
            
            document.getElementById('conf-ref').textContent = data.reference;
            document.getElementById('conf-service').textContent = data.service;
            document.getElementById('conf-barber').textContent = data.barber;
            document.getElementById('conf-date').textContent = Utils.formatDate(data.date);
            document.getElementById('conf-time').textContent = Utils.formatTime(data.start);

            document.getElementById('btn-calendar').addEventListener('click', () => {
                Utils.generateICS({
                    date: data.date,
                    start_time: data.start,
                    end_time: data.end,
                    service_name: data.service,
                    barber_name: data.barber,
                    address: "The Premium Barbershop" // Ideally from settings, hardcoded here for simplicity
                });
            });
            
            // Clear session to prevent re-submits if they go back
            // sessionStorage.removeItem('booking_result');
        });
    </script>
</body>
</html>
