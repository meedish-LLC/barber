<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - The Premium Barbershop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#0B0B0B] text-white pt-20 h-screen flex flex-col">

    <nav class="fixed top-0 w-full z-50 bg-[#0B0B0B]/90 backdrop-blur-sm border-b border-charcoal no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <a href="index.html" class="playfair text-2xl font-bold tracking-widest text-white uppercase" id="nav-brand">THE BARBER</a>
                </div>
                <div class="hidden md:flex space-x-8 items-center">
                    <a href="index.html" class="text-gray-300 hover:text-white transition-colors text-sm uppercase tracking-wider">Cancel Booking Process</a>
                </div>
                <div class="md:hidden flex items-center">
                    <a href="index.html" class="text-gray-300 hover:text-white">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex flex-col md:flex-row overflow-hidden max-w-7xl mx-auto w-full no-print pt-6 pb-6">
        
        <!-- Left side: Progress & Summary -->
        <aside class="w-full md:w-1/3 p-4 md:p-8 flex flex-col bg-[#111111] border border-charcoal rounded-xl md:mr-6 overflow-y-auto hidden md:flex">
            <h2 class="playfair text-2xl font-bold mb-8 text-gold">Booking Progress</h2>
            
            <ul class="space-y-6 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-charcoal before:to-transparent" id="progress-steps">
                <!-- Progress injected by JS -->
            </ul>

            <div id="booking-summary" class="mt-auto pt-8 border-t border-charcoal hidden">
                <h3 class="playfair text-xl font-bold mb-4">Summary</h3>
                <div class="space-y-3 text-sm text-gray-300" id="summary-content">
                    <!-- Summary injected by JS -->
                </div>
            </div>
        </aside>

        <!-- Right side: Dynamic Form Area -->
        <section class="w-full md:w-2/3 p-4 md:p-0 flex flex-col overflow-hidden relative" id="booking-container">
            <div class="flex-grow overflow-y-auto bg-[#151515] border border-charcoal rounded-xl p-6 md:p-10" id="step-content">
                <!-- Step content injected here -->
                <div class="flex items-center justify-center h-full">
                    <div class="text-center">
                        <i data-lucide="loader-2" class="w-10 h-10 animate-spin mx-auto mb-4 text-gold"></i>
                        <p class="text-gray-400">Initializing booking system...</p>
                    </div>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="mt-6 flex justify-between">
                <button id="btn-back" class="btn-outline hidden"><i data-lucide="arrow-left" class="w-4 h-4 inline mr-2"></i> Back</button>
                <button id="btn-next" class="btn-primary ml-auto hidden" disabled>Next <i data-lucide="arrow-right" class="w-4 h-4 inline ml-2"></i></button>
                <button id="btn-confirm" class="btn-primary ml-auto hidden w-full md:w-auto">CONFIRM APPOINTMENT</button>
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/booking.js"></script>
</body>
</html>
