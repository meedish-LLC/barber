<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - Premium Barbershop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#15171e] text-white pt-20 h-screen flex flex-col">

    <nav class="fixed top-0 w-full z-50 neu-nav no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <a href="index.html" class="playfair text-2xl font-bold tracking-widest text-white uppercase hover:text-gold transition-colors" id="nav-brand">Premium BARBERSHOP</a>
                </div>
                <div class="hidden md:flex space-x-8 items-center">
                    <a href="index.html" class="btn-outline text-xs py-2.5 px-5">Cancel Booking</a>
                </div>
                <div class="md:hidden flex items-center">
                    <a href="index.html" class="w-10 h-10 neu-circle flex items-center justify-center text-gray-300 hover:text-white">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex flex-col md:flex-row overflow-hidden max-w-7xl mx-auto w-full no-print p-4 md:p-6 gap-6">
        
        <!-- Left side: Progress & Summary -->
        <aside class="w-full md:w-1/3 p-6 md:p-8 flex flex-col neu-card overflow-y-auto hidden md:flex">
            <h2 class="playfair text-2xl font-bold mb-8 text-gold tracking-wide">Booking Progress</h2>
            
            <ul class="space-y-6 relative before:absolute before:inset-0 before:left-[15px] before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-[rgba(255,255,255,0.06)] before:to-transparent" id="progress-steps">
                <!-- Progress injected by JS -->
            </ul>

            <div id="booking-summary" class="mt-auto pt-6 hidden">
                <div class="neu-inset p-5 rounded-xl border border-[rgba(255,255,255,0.03)]">
                    <h3 class="playfair text-lg font-bold mb-3 text-gold flex items-center gap-2">
                        <i data-lucide="receipt" class="w-4 h-4"></i> Summary
                    </h3>
                    <div class="space-y-2.5 text-sm text-gray-300" id="summary-content">
                        <!-- Summary injected by JS -->
                    </div>
                </div>
            </div>
        </aside>

        <!-- Right side: Dynamic Form Area -->
        <section class="w-full md:w-2/3 flex flex-col overflow-hidden relative" id="booking-container">
            
            <!-- Mobile Progress Indicator -->
            <div class="md:hidden mb-4 neu-card p-4 flex flex-col gap-2.5">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-400">Step <span id="mobile-step-current" class="text-gold font-bold">1</span> of 6</span>
                    <span id="mobile-step-title" class="font-medium text-white">Service</span>
                </div>
                <div class="w-full neu-inset-sm h-3 rounded-full overflow-hidden p-0.5">
                    <div id="mobile-progress-bar" class="bg-gradient-to-r from-[#dfb738] to-[#C9A227] h-full rounded-full transition-all duration-300 shadow-sm" style="width: 16.6%;"></div>
                </div>
            </div>

            <div class="flex-grow overflow-y-auto neu-card p-6 md:p-10" id="step-content">
                <!-- Step content injected here -->
                <div class="flex items-center justify-center h-full">
                    <div class="text-center">
                        <i data-lucide="loader-2" class="w-10 h-10 animate-spin mx-auto mb-4 text-gold"></i>
                        <p class="text-gray-400">Initializing booking system...</p>
                    </div>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="mt-6 flex justify-between items-center">
                <button id="btn-back" class="btn-outline hidden"><i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Back</button>
                <button id="btn-next" class="btn-primary ml-auto hidden" disabled>Next <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i></button>
                <button id="btn-confirm" class="btn-primary ml-auto hidden w-full md:w-auto">CONFIRM APPOINTMENT</button>
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/booking.js"></script>
</body>
</html>
