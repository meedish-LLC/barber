<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Premium Barbershop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-[#15171e] text-white flex items-center justify-center min-h-screen p-4">

    <div class="neu-card p-8 md:p-10 max-w-md w-full">
        <div class="text-center mb-8">
            <div class="w-16 h-16 neu-circle flex items-center justify-center mx-auto mb-4 text-gold">
                <i data-lucide="shield-check" class="w-8 h-8"></i>
            </div>
            <h1 class="playfair text-3xl font-bold mb-2 tracking-wide">Admin Portal</h1>
            <p class="text-gray-400 text-sm">Sign in to manage the shop.</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                <input type="email" id="email" required class="input-field" value="admin@example.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                <div class="relative">
                    <input type="password" id="password" required class="input-field pr-12" value="admin">
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-gold transition-colors">
                        <i data-lucide="eye" id="eye-icon" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary w-full mt-6 py-3.5 text-base" id="btn-login">LOGIN</button>
        </form>
        <a href="../index.html" class="block text-center mt-6 text-sm text-gray-400 hover:text-gold transition-colors">&larr; Back to Shop</a>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
