<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - The Premium Barbershop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-[#0B0B0B] text-white flex items-center justify-center h-screen">

    <div class="bg-[#111111] border border-charcoal rounded-xl p-8 max-w-sm w-full">
        <div class="text-center mb-8">
            <h1 class="playfair text-3xl font-bold mb-2">Admin Portal</h1>
            <p class="text-gray-400 text-sm">Sign in to manage the shop.</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                <input type="email" id="email" required class="input-field" value="admin@example.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="password" required class="input-field pr-10" value="admin">
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-white">
                        <i data-lucide="eye" id="eye-icon" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary w-full mt-6" id="btn-login">LOGIN</button>
        </form>
        <a href="../index.html" class="block text-center mt-6 text-sm text-gray-500 hover:text-white">&larr; Back to Shop</a>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
